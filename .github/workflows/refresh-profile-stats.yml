name: Refresh profile stats

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recount profile stats
        env:
          ORG_STATS_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: python3 scripts/refresh_profile_stats.py

      - name: Commit updated numbers
        run: |
          if git diff --quiet profile/README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: refresh profile stats"
          git push
